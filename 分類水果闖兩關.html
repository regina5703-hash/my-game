<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果構造配對 - 完整遊戲流程版</title>
    <style>
        :root { 
            --primary: #3498db; --bg: #f8fafc; --success: #2ecc71; --error: #e74c3c; 
            --card-bg: #ffffff; --text-main: #2c3e50;
            --grid-border: #e2e8f0; 
        }
        
        body { 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
            background: var(--bg); margin: 0; display: flex; 
            flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden; 
        }

        /* 灑花動畫 */
        .confetti {
            position: absolute; width: 10px; height: 10px;
            z-index: 2000; top: -10px; opacity: 0.8;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        .header { width: 100%; text-align: center; padding: 10px 0; }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 900; color: var(--text-main); }

        .dashboard {
            background: #ffffff; padding: 10px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 15px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .timer-display { 
            font-family: 'Courier New', monospace; font-size: 1.8rem; 
            font-weight: bold; color: #2ecc71; background: #2c3e50;
            padding: 4px 20px; border-radius: 30px;
        }

        .btn { padding: 8px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 25px; color: white; transition: 0.3s; }
        .btn-start { background: #27ae60; }
        .btn-next { background: #3498db; }
        .btn-level { background: #95a5a6; }
        .btn-active { background: #e67e22 !important; }

        .game-container { 
            display: flex; width: 92vw; max-width: 1200px; flex: 1; 
            gap: 30px; padding-bottom: 25px; box-sizing: border-box; justify-content: center; 
        }

        .left-zones { flex: 0 0 360px; display: flex; flex-direction: column; gap: 10px; }
        .match-row { 
            background: var(--card-bg); border-radius: 15px; 
            display: flex; align-items: center; padding: 10px 18px; height: 18.5%; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 2px solid var(--grid-border);
            box-sizing: border-box;
        }
        .match-row.drag-over { border: 4px solid var(--primary) !important; background-color: #e3f2fd; }
        
        .type-img { width: 50px; height: 50px; object-fit: contain; margin-right: 15px; }
        .type-label-box { width: 110px; flex-shrink: 0; display: flex; flex-direction: column; }
        .main-label { font-size: 1.2rem; font-weight: 900; color: var(--text-main); }
        .sub-label { font-size: 0.8rem; color: #7f8c8d; }

        .slot { 
            flex: 1; height: 60px; border-radius: 12px; background: #f1f8ff; 
            display: flex; align-items: center; padding: 0 10px; gap: 6px; overflow-x: auto;
            border: 1.5px dashed #bcd4e6;
        }

        .right-wrapper { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            background: rgba(255,255,255,0.4); border-radius: 30px;
        }

        .big-fruit { 
            width: 480px; height: 480px; border-radius: 40px; background: white; 
            cursor: grab; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 2px solid var(--grid-border);
        }
        .big-fruit img { width: 95%; height: 95%; object-fit: contain; pointer-events: none; }

        /* 藍莓縮小設定：在第一關縮小成 0.5 */
        .big-fruit[data-name="藍莓"] img {
            transform: scale(0.5);
        }

        .lv2-grid { 
            display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr); 
            gap: 12px; width: 100%; height: 100%; padding: 10px; box-sizing: border-box;
        }
        .small-fruit { 
            border-radius: 15px; cursor: grab; display: flex; align-items: center; 
            justify-content: center; background: #fff; border: 2px solid var(--grid-border); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
        }
        .small-fruit img { max-width: 85%; max-height: 85%; pointer-events: none; }

        .in-slot-img { width: 45px; height: 45px; object-fit: contain; border-radius: 8px; background: #fff; border: 1px solid #eee; }

        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; display: none; justify-content: center; align-items: center; font-size: 200px; }
        .bg-correct { background: rgba(46, 204, 113, 0.2); color: #27ae60; }
        .bg-wrong { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

        #win-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(44, 62, 80, 0.98); display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
            color: white; z-index: 3000; 
        }
        .win-btns { display: flex; gap: 20px; margin-top: 30px; }
    </style>
</head>
<body>

    <div id="feedback-overlay"></div>
    <div id="win-screen"></div>

    <div class="header"><h1>🍎 水果構造配對挑戰</h1></div>

    <div class="dashboard">
        <div class="timer-display" id="timer">00:00</div>
        <button id="btn-start" class="btn btn-start" onclick="startGame()">▶ 開始挑戰</button>
        <button id="btn-lv1" class="btn btn-level btn-active" onclick="changeLevel(1)">第 1 關</button>
        <button id="btn-lv2" class="btn btn-level" onclick="changeLevel(2)">第 2 關</button>
        <button class="btn" style="background:#34495e" onclick="initGame()">🔄 重置</button>
    </div>

    <div class="game-container">
        <div class="left-zones" id="zones"></div>
        <div class="right-wrapper" id="pile-container"></div>
    </div>

    <script>
        const types = [
            { id: 'pome', label: '仁果類', sub: '星形果心', img: '仁果類.jpg' },
            { id: 'drupe', label: '核果類', sub: '單一硬核', img: '核果類.jpg' },
            { id: 'berry', label: '漿果類', sub: '種子散布', img: '漿果類.jpg' },
            { id: 'pepo', label: '瓜果類', sub: '集中空腔', img: '瓜果類.jpg' },
            { id: 'hes', label: '柑橘類', sub: '放射囊瓣', img: '柑橘類.jpg' }
        ];

        const fruitData = [
            { name: '蘋果', type: 'pome' }, { name: '西洋梨', type: 'pome' }, { name: '水梨', type: 'pome' }, { name: '枇杷', type: 'pome' },
            { name: '櫻桃', type: 'drupe' }, { name: '荔枝', type: 'drupe' }, { name: '芒果', type: 'drupe' }, { name: '李子', type: 'drupe' }, { name: '水蜜桃', type: 'drupe' },
            { name: '杮子', type: 'berry' }, { name: '藍莓', type: 'berry' }, { name: '葡萄', type: 'berry' }, { name: '香蕉', type: 'berry' }, { name: '火龍果', type: 'berry' }, { name: '奇異果', type: 'berry' }, { name: '草莓', type: 'berry' },
            { name: '香瓜', type: 'pepo' }, { name: '西瓜', type: 'pepo' }, { name: '木瓜', type: 'pepo' }, { name: '哈蜜瓜', type: 'pepo' },
            { name: '葡萄柚', type: 'hes' }, { name: '柚子', type: 'hes' }, { name: '金桔', type: 'hes' }, { name: '橘子', type: 'hes' }, { name: '檸檬', type: 'hes' }
        ];

        let seconds = 0, timerInterval = null, isRunning = false, currentLevel = 1, currentFruits = [];
        let draggedElement = null;

        function initGame() {
            clearInterval(timerInterval); seconds = 0; isRunning = false;
            document.getElementById('timer').innerText = "00:00";
            document.getElementById('win-screen').style.display = 'none';
            const zones = document.getElementById('zones');
            zones.innerHTML = types.map(t => `
                <div class="match-row" data-type="${t.id}" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="handleDrop(event)">
                    <img src="${t.img}" class="type-img" onerror="this.style.opacity='0.2'">
                    <div class="type-label-box">
                        <span class="main-label">${t.label}</span>
                        <span class="sub-label">${t.sub}</span>
                    </div>
                    <div class="slot"></div>
                </div>
            `).join('');

            // 洗牌並決定第二關只顯示24種
            const shuffled = [...fruitData].sort(() => Math.random() - 0.5);
            if (currentLevel === 1) {
                currentFruits = shuffled;
            } else {
                currentFruits = shuffled.slice(0, 24);
            }
            renderPile();
        }

        function renderPile() {
            const container = document.getElementById('pile-container');
            container.innerHTML = '';
            if (currentLevel === 1) {
                if (currentFruits.length > 0) {
                    const f = currentFruits[0];
                    const item = document.createElement('div');
                    item.className = 'big-fruit';
                    item.draggable = true;
                    item.dataset.type = f.type; item.dataset.name = f.name;
                    item.ondragstart = drag;
                    item.innerHTML = `<img src="${f.name}.jpg" onerror="this.src='${f.name}.png'">`;
                    container.appendChild(item);
                }
            } else {
                const grid = document.createElement('div');
                grid.className = 'lv2-grid';
                currentFruits.forEach((f) => {
                    const item = document.createElement('div');
                    item.className = 'small-fruit';
                    item.draggable = true;
                    item.dataset.type = f.type; item.dataset.name = f.name;
                    item.ondragstart = drag;
                    item.innerHTML = `<img src="${f.name}.jpg" onerror="this.src='${f.name}.png'">`;
                    grid.appendChild(item);
                });
                container.appendChild(grid);
            }
        }

        function changeLevel(lv) { 
            currentLevel = lv; 
            document.getElementById('btn-lv1').classList.toggle('btn-active', lv === 1); 
            document.getElementById('btn-lv2').classList.toggle('btn-active', lv === 2); 
            initGame(); 
        }

        function startGame() { if (isRunning) return; isRunning = true; timerInterval = setInterval(() => { seconds++; const m = Math.floor(seconds/60).toString().padStart(2,'0'); const s = (seconds%60).toString().padStart(2,'0'); document.getElementById('timer').innerText = `${m}:${s}`; }, 1000); }
        function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function leaveDrop(e) { e.currentTarget.classList.remove('drag-over'); }
        function drag(e) { if (!isRunning) return; draggedElement = e.target; e.dataTransfer.setData("type", e.target.dataset.type); e.dataTransfer.setData("name", e.target.dataset.name); }
        
        function handleDrop(e) {
            e.preventDefault();
            const row = e.currentTarget; row.classList.remove('drag-over');
            const fType = e.dataTransfer.getData("type");
            const fName = e.dataTransfer.getData("name");
            
            if (fType === row.dataset.type) {
                currentFruits = currentFruits.filter(f => f.name !== fName);
                
                if (currentLevel === 1) {
                    // 第一關：配對成功立即清空右側容器 (原始設定)
                    document.getElementById('pile-container').innerHTML = ''; 
                } else {
                    // 第二關：移除拖動的該個小水果 (原始設定)
                    if (draggedElement) draggedElement.remove();
                    const img = document.createElement('img');
                    img.src = `${fName}.jpg`; img.className = 'in-slot-img';
                    img.onerror = () => img.src = `${fName}.png`;
                    row.querySelector('.slot').appendChild(img);
                }
                
                showFeedback("⭕", "bg-correct");
                setTimeout(() => {
                    if (currentLevel === 1) renderPile(); 
                    checkWin();
                }, 400);
            } else {
                showFeedback("❌", "bg-wrong");
            }
            draggedElement = null;
        }
        
        function showFeedback(text, cls) {
            const div = document.getElementById('feedback-overlay');
            div.innerHTML = text; div.className = cls; div.style.display = 'flex';
            setTimeout(() => div.style.display = 'none', 400);
        }

        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                confetti.style.animationDelay = (Math.random() * 1) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function checkWin() {
            if (currentFruits.length === 0) {
                clearInterval(timerInterval);
                createConfetti();
                const win = document.getElementById('win-screen');
                win.style.display = 'flex';
                
                let btnHTML = '';
                if (currentLevel === 1) {
                    btnHTML = `
                        <div class="win-btns">
                            <button class="btn btn-start" onclick="initGame()">再玩一次</button>
                            <button class="btn btn-next" onclick="changeLevel(2)">進下一關</button>
                        </div>
                    `;
                } else {
                    btnHTML = `
                        <div class="win-btns">
                            <button class="btn btn-start" onclick="initGame()">再玩一次</button>
                        </div>
                    `;
                }

                win.innerHTML = `
                    <h1 style="font-size:4rem; margin-bottom:10px;">🎉 恭喜過關！</h1>
                    <p style="font-size:1.5rem;">您已成功完成 第 ${currentLevel} 關</p>
                    <p style="font-size:1.2rem; background:rgba(255,255,255,0.2); padding:10px 30px; border-radius:20px;">總耗時：${document.getElementById('timer').innerText}</p>
                    ${btnHTML}
                `;
            }
        }
        window.onload = initGame;
    </script>
</body>
</html>
