<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>擦桌子教學 - 簡潔路徑版</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background: #2C1B0E; display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            touch-action: none; margin: 0; height: 100vh; overflow: hidden;
        }
        #game-wrapper {
            position: relative; width: 45vw; height: 75vh;
            background-color: #8B5A2B;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            border: 15px solid #5D4037; border-radius: 20px; 
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
        }
        .instruction { 
            font-size: 1.8rem; font-weight: bold; margin: 10px 0; 
            color: #FFD700; text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #clean-canvas { position: absolute; top: 0; left: 0; z-index: 10; width: 100%; height: 100%; }
        .stain { 
            position: absolute; background: #FF4500; border-radius: 50%; 
            width: 18px; height: 18px; z-index: 15; border: 2px solid white; 
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #hand-guide {
            position: absolute; width: 60px; height: 60px; z-index: 100; pointer-events: none;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.6)); display: block;
            transform: translate(-50%, -50%); will-change: left, top;
        }
        #warning-overlay { 
            position: absolute; width: 100%; height: 100%; 
            background: rgba(180, 0, 0, 0.9); display: none; z-index: 500; 
            justify-content: center; align-items: center; color: white; 
            font-size: 2rem; font-weight: bold; text-align: center;
        }
        .controls { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        button { 
            padding: 10px 18px; font-size: 1rem; cursor: pointer; 
            background: #4E342E; color: #D7CCC8; border: 2px solid #FFD700; 
            border-radius: 10px; font-weight: bold;
        }
        #status-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; align-items: center; z-index: 300;
            background: #2E7D32; padding: 40px; border-radius: 20px; border: 5px solid #A5D6A7;
            width: 80%; text-align: center;
        }
        #status-text { 
            font-size: 2.5rem; color: white; font-weight: bold; 
            margin-bottom: 25px; white-space: nowrap; 
        }
    </style>
</head>
<body>

    <div class="instruction" id="msg">請開始清潔桌面</div>
    
    <div id="game-wrapper">
        <div id="warning-overlay">順序錯誤請重試</div>
        <div id="hand-guide">
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path fill="#FFDBAC" d="M414,310c0-60-40-100-40-100V120c0-22-18-40-40-40s-40,18-40,40v80h-10v-90c0-22-18-40-40-40s-40,18-40,40v90h-10V80c0-22-18-40-40-40s-40,18-40,40v140h-10V150c0-22-18-40-40-40s-40,18-40,40v220c0,80,60,140,140,140h60c80,0,140-60,140-140V310z" />
            </svg>
        </div>
        <canvas id="clean-canvas"></canvas>
        <div id="stains-layer"></div>
        <div id="status-container">
            <div id="status-text"></div>
            <button onclick="initLevel(currentLV)" style="background:white; color:#1B5E20; border:none; padding:10px 30px; border-radius:10px; cursor:pointer; font-weight:bold;">再練一次</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="initLevel(1)">1. 上下上下擦拭練習</button>
        <button onclick="initLevel(2)">2. 引導練習</button>
        <button onclick="initLevel(3)">3. 自我測試</button>
        <button onclick="initLevel(4)">4. 順時針包邊練習</button>
    </div>

    <script>
        const canvas = document.getElementById('clean-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('game-wrapper');
        const hand = document.getElementById('hand-guide');
        const stainLayer = document.getElementById('stains-layer');
        const warning = document.getElementById('warning-overlay');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        
        let isDrawing = false, lastIdx = -1, points = [], currentLV = 1, stains = [];
        const TOUCH_RADIUS = 30;

        function initLevel(lv) {
            currentLV = lv; 
            canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight;
            statusContainer.style.display = 'none'; warning.style.display = 'none';
            stainLayer.innerHTML = ''; stains = []; lastIdx = -1; isDrawing = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            points = generatePoints(lv);

            if(lv === 4) {
                hand.style.left = (points[0].x - 45) + "px";
                hand.style.top = (points[0].y - 45) + "px";
                document.getElementById('msg').innerText = "從左上角外側切入封邊";
            } else {
                hand.style.left = points[0].x + "px";
                hand.style.top = points[0].y + "px";
                document.getElementById('msg').innerText = (lv === 1) ? "沿著藍色路徑上下擦拭" : "請上下上下規則清潔桌面";
            }

            if(lv !== 3) drawFullGuide("rgba(13, 71, 161, 0.7)", 38);
            
            // 點點生成邏輯修正：第一關跳過
            if(lv === 2) createStains(10);
            else if(lv === 3) createStains(1);
            else if(lv === 4) createStains(60); 
        }

        function generatePoints(lv) {
            const pts = [], w = canvas.width, h = canvas.height;
            const mX = w*0.1, mY = h*0.1, aW = w*0.8, aH = h*0.8;
            if(lv === 3) {
                const cols = 12, rows = 12;
                for(let i=0; i<cols; i++){
                    let x = mX + (aW/(cols-1))*i;
                    if(i%2===0) { for(let j=0; j<rows; j++) pts.push({x, y: mY + (aH/(rows-1))*j}); }
                    else { for(let j=rows-1; j>=0; j--) pts.push({x, y: mY + (aH/(rows-1))*j}); }
                }
            } else if(lv === 4) {
                const s = 60;
                for(let i=0; i<=s; i++) pts.push({x: mX + (aW/s)*i, y: mY}); 
                for(let i=1; i<=s; i++) pts.push({x: mX + aW, y: mY + (aH/s)*i}); 
                for(let i=1; i<=s; i++) pts.push({x: mX + aW - (aW/s)*i, y: mY + aH}); 
                for(let i=1; i<=s; i++) pts.push({x: mX, y: mY + aH - (aH/s)*i}); 
            } else {
                const cols = 7, rows = 32, trans = 10;
                for(let i=0; i<cols; i++){
                    let x = mX + (aW/(cols-1))*i;
                    if(i%2===0) { for(let j=0; j<rows; j++) pts.push({x, y: mY + (aH/(rows-1))*j}); }
                    else { for(let j=rows-1; j>=0; j--) pts.push({x, y: mY + (aH/(rows-1))*j}); }
                    if(i < cols - 1) {
                        let nX = mX + (aW/(cols-1))*(i+1);
                        let curY = (i%2===0) ? (mY + aH) : mY;
                        for(let k=1; k<=trans; k++) pts.push({x: x + (nX-x)*(k/trans), y: curY});
                    }
                }
            }
            return pts;
        }

        function createStains(step) {
            points.forEach((p, i) => {
                if (i % step === 0 || i === points.length - 1) {
                    const s = document.createElement('div');
                    s.className = 'stain';
                    s.style.left = p.x + 'px'; s.style.top = p.y + 'px';
                    stainLayer.appendChild(s);
                    stains[i] = s;
                }
            });
        }

        function drawFullGuide(color, width) {
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.moveTo(points[0].x, points[0].y);
            points.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();
        }

        function handleMove(e) {
            if (statusContainer.style.display === 'flex' || warning.style.display === 'flex') return;
            const rect = canvas.getBoundingClientRect();
            const cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

            if (isDrawing) {
                hand.style.left = cx + "px"; hand.style.top = cy + "px";
                
                for(let i = lastIdx + 1; i < Math.min(lastIdx + 12, points.length); i++) {
                    const d = Math.sqrt((cx-points[i].x)**2 + (cy-points[i].y)**2);
                    if(d < TOUCH_RADIUS) { 
                        for(let s = lastIdx + 1; s <= i; s++) {
                            ctx.beginPath(); ctx.fillStyle = "rgba(255, 255, 255, 0.25)"; 
                            ctx.arc(points[s].x, points[s].y, 25, 0, Math.PI*2); ctx.fill();
                            if(stains[s]) { stains[s].style.opacity = '0'; stains[s].style.transform = 'scale(0)'; }
                        }
                        lastIdx = i;
                    }
                }

                if(lastIdx !== -1) {
                    let failLimit = (currentLV === 3) ? 18 : 30;
                    for(let i = lastIdx + failLimit; i < points.length; i++) {
                        if(Math.sqrt((cx-points[i].x)**2 + (cy-points[i].y)**2) < 22) { triggerFail(); return; }
                    }
                } else {
                    if(Math.sqrt((cx-points[0].x)**2 + (cy-points[0].y)**2) < TOUCH_RADIUS) lastIdx = 0;
                }

                if(lastIdx >= points.length - 1) {
                    if(currentLV === 1) statusText.innerText = "上下上下練習完成";
                    if(currentLV === 2) statusText.innerText = "引導擦拭完成";
                    if(currentLV === 3) statusText.innerText = "自我測試";
                    if(currentLV === 4) statusText.innerText = "包邊練習";
                    statusContainer.style.display = 'flex';
                }
            }
        }

        function triggerFail() {
            if(warning.style.display === 'flex') return;
            isDrawing = false; warning.style.display = 'flex';
            setTimeout(() => initLevel(currentLV), 1200);
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; handleMove(e); });
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); handleMove(e); });
        window.addEventListener('mouseup', () => { isDrawing = false; });
        window.addEventListener('touchend', () => { isDrawing = false; });
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); });
        window.onload = () => initLevel(1);
    </script>
</body>
</html>
