<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲進入點</title>
    <style>
        /* 讓背景保持乾淨，內容居中 */
        body { 
            font-family: sans-serif; 
            background-color: #fff5f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        /* 移除原本的容器背景與陰影，讓畫面不像「大廳」 */
        .direct-link { 
            text-align: center; 
        }

        .btn { 
            display: inline-block; 
            padding: 25px 60px; 
            color: white; 
            text-decoration: none; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 1.5em; /* 稍微放大按鈕 */
            transition: transform 0.2s, background 0.2s;
            background: #e67e22;
            box-shadow: 0 8px 15px rgba(230, 126, 34, 0.3);
        }

        .btn:hover { 
            transform: scale(1.1); 
            background: #d35400;
        }
    </style>
</head>
<body>

    <div class="direct-link">
        <a class="btn" href="分類水果闖兩關.html">
            🎯 點擊開始水果配對遊戲
        </a>
    </div>

</body>
</html>
