<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 水果遊戲大本營</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #fff5f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        h1 { color: #d35400; margin-bottom: 25px; }
        
        /* 網格設定：手機一列，電腦兩列 */
        .game-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }
        
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px 10px; 
            background: #e67e22; 
            color: white; 
            text-decoration: none; 
            border-radius: 15px; 
            font-size: 1.1em; 
            font-weight: bold; 
            transition: 0.3s;
            min-height: 60px;
        }

        /* 不同顏色的按鈕區分 */
        .btn-1 { background: #e67e22; } /* 橘色 */
        .btn-2 { background: #f1c40f; } /* 黃色 */
        .btn-3 { background: #2ecc71; } /* 綠色 */
        .btn-4 { background: #3498db; } /* 藍色 */
        .btn-5 { background: #9b59b6; } /* 紫色 */

        .btn:hover { transform: scale(1.05); filter: brightness(0.9); }
        
        /* 最後一個按鈕佔滿整行（如果是單數） */
        .btn:last-child:nth-child(odd) {
            grid-column: span 2;
        }

        @media (max-width: 400px) {
            .game-grid { grid-template-columns: 1fr; }
            .btn:last-child:nth-child(odd) { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍎 水果遊戲選單</h1>
        
        <div class="game-grid">
            <a class="btn btn-1" href="分類水果闖兩關.html">🎯 水果配對 A</a>
            <a class="btn btn-2" href="分類水果闖兩關(有音效).html">🔊 水果配對 B</a>
            <a class="btn btn-3" href="單一多對多水果分類配對原始版.html">🍓 水果找找看</a>
            <a class="btn btn-4" href="水果樹分類遊戲tree.html">🍍 水果樹</a>
            <a class="btn btn-5" href="水果剖面配對遮蔽版.html">🍉 水果大挑戰</a>
        </div>

    </div>
</body>
</html>
