<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>水果構造配對 - 最終強化版</title>
    <style>
        :root { --primary: #3498db; --bg: #f1f5f9; --accent: #e67e22; --success: #2ecc71; --error: #e74c3c; --led-bg: #0a110a; }
        body { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        .header { width: 100%; text-align: center; padding: 5px 0 0 0; }
        h1 { margin: 0; font-size: 1.5rem; color: #1e293b; letter-spacing: 2px; }
        
        /* 儀表板 - 單列水平 */
        .dashboard {
            background: #2c3e50; padding: 5px 15px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2), inset 0 0 8px rgba(0,0,0,0.5);
            border: 2px solid #bdc3c7; margin: 5px 0; width: 95vw; box-sizing: border-box;
        }
        .timer-container { background: var(--led-bg); padding: 5px 15px; border-radius: 8px; border: 2px solid #34495e; height: 40px; display: flex; align-items: center; justify-content: center; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 2.2rem; font-weight: bold; color: #1a2a1a; transition: 0.3s; margin-top: -3px; }
        .timer-active { color: #2ecc71; text-shadow: 0 0 8px rgba(46, 204, 113, 0.8); }

        .btn-main { padding: 8px 18px; font-size: 0.95rem; font-weight: bold; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 6px; box-shadow: 0 3px 0 #2980b9; height: 38px; display: flex; align-items: center; gap: 6px; }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 1px 0 #2980b9; }
        .btn-start { background: #27ae60; box-shadow: 0 3px 0 #1e8449; }
        .btn-reset-main { background: #7f8c8d; box-shadow: 0 3px 0 #606c6d; }

        .game-container { display: flex; width: 98vw; flex: 1; padding: 5px 10px; box-sizing: border-box; gap: 10px; overflow: hidden; margin-bottom: 5px; }
        
        /* ⭐ 左側類別區：提示圖最大化修正 */
        .left-zones { flex: 0.38; /* 稍微增加左側寬度以容納更大的圖與字 */ display: flex; flex-direction: column; gap: 6px; background: white; border-radius: 12px; padding: 10px; border: 1px solid #cbd5e1; }
        
        .match-row { background: #fff; border: 2px solid #e2e8f0; border-radius: 10px; display: flex; align-items: center; padding: 3px 12px; height: calc(20% - 6px); box-sizing: border-box; overflow: hidden; /* ⭐ 確保任何東西都不溢出框框 */ }
        
        /* ⭐ 核心修正：提示圖最大化 (65px) */
        .section-img { 
            width: 65px; 
            height: 65px; 
            object-fit: contain; /* ⭐ 保持比例且不超出框 */
            flex-shrink: 0; 
            margin-right: 5px; /* ⭐ 增加與文字的間距 */
        }
        
        .text-info { 
            margin: 0 10px; 
            width: 110px; /* ⭐ 配合字體放大微調寬度 */
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; /* 類別在描述上方 */
            justify-content: center;
        }
        .text-info b { font-size: 1.25rem; font-weight: 900; color: #1e293b; line-height: 1.1; }
        .text-info span { font-size: 0.85rem; font-weight: 600; color: #475569; margin-top: 4px; }

        .slot { flex: 1; height: 60px; /* ⭐ 稍微加高 Slot 配合更大的提示圖，視覺更平衡 */ border: 2px dashed #94a3b8; border-radius: 8px; display: flex; align-items: center; gap: 4px; background: #f8fafc; overflow-x: auto; box-sizing: border-box; }

        .right-wrapper { flex: 0.62; position: relative; height: 100%; }
        .right-pile { 
            width: 100%; height: 100%; background: white; border-radius: 12px; padding: 10px; 
            display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr); 
            gap: 8px; border: 1px solid #cbd5e1; box-sizing: border-box;
        }
        
        /* READY? 遮罩 */
        #game-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(5px);
            z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; text-align: center;
        }
        .ready-text { font-size: 5.5rem; font-weight: 900; color: #2c3e50; margin: 0; line-height: 1; text-shadow: 0 0 20px rgba(241, 196, 15, 0.4); letter-spacing: 5px; }
        .sub-ready-text { font-size: 1.8rem; font-weight: bold; color: #5d6d7e; margin-top: 20px; letter-spacing: 2px; }

        .fruit-item { width: 100%; height: 100%; cursor: grab; background: white; border: 2px solid #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 1px; box-sizing: border-box; overflow: hidden; transition: transform 0.2s; }
        .fruit-item img { max-width: 85%; max-height: 85%; object-fit: contain; pointer-events: none; }
        .slot .fruit-item { width: 55px; height: 55px; flex-shrink: 0; border: none; } /* ⭐ 配合加高的 Slot 微調縮圖 */

        /* 極速回饋 (0.6秒) */
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; display: none; justify-content: center; align-items: center; pointer-events: none; }
        .circle { width: 320px; height: 320px; border: 35px solid var(--success); border-radius: 50%; animation: popFast 0.6s forwards; box-shadow: 0 0 50px rgba(39, 174, 96, 0.5); }
        .cross { font-size: 450px; color: var(--error); font-weight: bold; animation: popFast 0.6s forwards; line-height: 1; text-shadow: 0 0 50px rgba(231, 76, 60, 0.5); }

        @keyframes popFast {
            0% { transform: scale(0); opacity: 0; }
            20% { transform: scale(1.1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0; }
        }

        #congrats-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .congrats-title { font-size: 5rem; font-weight: bold; text-shadow: 0 0 30px #f1c40f; margin-bottom: 20px; animation: scaleUp 0.8s ease-out; }
        .confetti { position: fixed; width: 15px; height: 15px; animation: rain 4s linear infinite; z-index: 1001; }

        @keyframes scaleUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes rain { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="feedback-overlay"></div>
    <div id="congrats-overlay"></div>

    <div class="header">
        <h1>🍎 水果構造配對挑戰</h1>
    </div>

    <div class="dashboard">
        <div class="timer-container">
            <div class="timer-display" id="timer">00:00</div>
        </div>
        <button id="btn-start-game" class="btn-main btn-start" onclick="startGame()">▶ 開始挑戰</button>
        <button class="btn-main btn-reset-main" onclick="initGame()">🔄 重整盤面</button>
    </div>

    <div class="game-container">
        <div class="left-zones" id="drop-zones"></div>
        <div class="right-wrapper">
            <div id="game-overlay">
                <p class="ready-text">READY?</p>
                <p class="sub-ready-text">按下「開始挑戰」開始計時</p>
            </div>
            <div id="pile" class="right-pile"></div>
        </div>
    </div>

    <script>
        let totalSeconds = 0;
        let timerInterval = null;
        let isRunning = false;
        let lastOrder = ""; // ⭐ 紀錄上次順序，強制不重覆

        const types = [
            { id: 'pome', label: '仁果類', sub: '星形果心', img: '仁果類.jpg' },
            { id: 'drupe', label: '核果類', sub: '單一硬核', img: '核果類.jpg' },
            { id: 'berry', label: '漿果類', sub: '種子散布', img: '漿果類.jpg' },
            { id: 'pepo', label: '瓜果類', sub: '集中空腔', img: '瓜果類.jpg' },
            { id: 'hes', label: '柑橘類', sub: '放射囊瓣', img: '柑橘類.jpg' }
        ];

        const fruits = [
            { name: '蘋果', type: 'pome' }, { name: '西洋梨', type: 'pome' }, { name: '水梨', type: 'pome' }, { name: '枇杷', type: 'pome' },
            { name: '櫻桃', type: 'drupe' }, { name: '荔枝', type: 'drupe' }, { name: '水蜜桃', type: 'drupe' }, { name: '芒果', type: 'drupe' }, { name: '李子', type: 'drupe' },
            { name: '杮子', type: 'berry' }, { name: '藍莓', type: 'berry' }, { name: '葡萄', type: 'berry' }, { name: '香蕉', type: 'berry' }, { name: '火龍果', type: 'berry' }, { name: '奇異果', type: 'berry' }, { name: '草莓', type: 'berry' },
            { name: '香瓜', type: 'pepo' }, { name: '西瓜', type: 'pepo' }, { name: '木瓜', type: 'pepo' }, { name: '哈蜜瓜', type: 'pepo' },
            { name: '葡萄柚', type: 'hes' }, { name: '柚子', type: 'hes' }, { name: '金桔', type: 'hes' }, { name: '橘子', type: 'hes' }
        ];

        function updateTimerDisplay() {
            const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        // ⭐ 按下開始才計時
        function startGame() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('btn-start-game').style.opacity = '0.5';
            document.getElementById('btn-start-game').style.pointerEvents = 'none';
            document.getElementById('timer').classList.add('timer-active');
            timerInterval = setInterval(() => { totalSeconds++; updateTimerDisplay(); }, 1000);
        }

        // ⭐ 極速圈叉回饋 (0.6s)
        function showFeedback(isCorrect) {
            const overlay = document.getElementById('feedback-overlay');
            overlay.innerHTML = isCorrect ? '<div class="circle"></div>' : '<div class="cross">×</div>';
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.display = 'none'; }, 600);
        }

        // ⭐ 撒花特效函式
        function createConfetti() {
            const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'];
            for(let i=0; i<150; i++) { // 增加花瓣數量
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDelay = Math.random() * 3 + 's';
                c.style.width = (Math.random() * 15 + 8) + 'px';
                c.style.height = c.style.width;
                document.body.appendChild(c);
            }
        }

        function initGame() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = null; totalSeconds = 0; isRunning = false;
            updateTimerDisplay();
            
            document.getElementById('timer').classList.remove('timer-active');
            document.getElementById('game-overlay').style.display = 'flex';
            document.getElementById('btn-start-game').style.opacity = '1';
            document.getElementById('btn-start-game').style.pointerEvents = 'auto';
            document.querySelectorAll('.confetti').forEach(el => el.remove());
            document.getElementById('congrats-overlay').style.display = 'none';

            // ⭐ 強制隨機洗牌，且不與上次重覆
            let shuffled;
            let currentOrder;
            do {
                shuffled = [...fruits].sort(() => Math.random() - 0.5);
                currentOrder = shuffled.map(f => f.name).join(",");
            } while (currentOrder === lastOrder);
            lastOrder = currentOrder;

            const zoneContainer = document.getElementById('drop-zones');
            zoneContainer.innerHTML = '';
            types.forEach(t => {
                zoneContainer.innerHTML += `
                    <div class="match-row" data-answer="${t.id}">
                        <img src="${t.img}" class="section-img" onerror="this.style.opacity='0.2'">
                        <div class="text-info"><b>${t.label}</b><span>${t.sub}</span></div>
                        <div class="slot" ondragover="allowDrop(event)" ondragleave="clearH(event)" ondrop="handleDrop(event)"></div>
                    </div>`;
            });

            const pile = document.getElementById('pile');
            pile.innerHTML = '';
            shuffled.forEach((f, i) => {
                const item = document.createElement('div');
                item.className = 'fruit-item';
                item.draggable = true;
                item.id = 'fruit-' + i;
                item.dataset.type = f.type;
                const img = document.createElement('img');
                img.src = f.name + '.jpg';
                img.onerror = function() { this.src = f.name + '.jpeg'; };
                item.appendChild(img);
                item.ondragstart = (e) => {
                    if(!isRunning) { e.preventDefault(); return; }
                    e.dataTransfer.setData('text', item.id);
                };
                pile.appendChild(item);
            });
        }

        function allowDrop(e) { e.preventDefault(); e.currentTarget.closest('.match-row').style.borderColor = '#3498db'; }
        function clearH(e) { e.currentTarget.closest('.match-row').style.borderColor = '#e2e8f0'; }
        
        function handleDrop(e) {
            e.preventDefault();
            const row = e.currentTarget.closest('.match-row');
            row.style.borderColor = '#e2e8f0';
            const fruitId = e.dataTransfer.getData('text');
            const fruitEl = document.getElementById(fruitId);
            
            if (row.dataset.answer === fruitEl.dataset.type) {
                showFeedback(true);
                row.querySelector('.slot').appendChild(fruitEl);
                fruitEl.draggable = false;
                if (document.querySelectorAll('#pile .fruit-item').length === 0) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        const overlay = document.getElementById('congrats-overlay');
                        overlay.style.display = 'flex';
                        // 使用計時器顯示的 READY 文字樣式
                        overlay.innerHTML = `<div class="congrats-title">🎉 恭喜過關！ 🎉</div><div style="font-size:2.5rem; text-shadow:0 0 15px rgba(255,255,255,0.5)">紀錄時間：${document.getElementById('timer').innerText}</div><button class='btn-main btn-reset-main' style='margin-top:30px; background:#f1c40f; box-shadow:0 3px 0 #d4ac0d; height:45px; font-size:1.1rem' onclick='initGame()'>🔄 重新挑戰</button>`;
                        createConfetti(); // 撒花慶祝
                    }, 800);
                }
            } else { showFeedback(false); }
        }

        window.onload = initGame;
    </script>
</body>
</html>
