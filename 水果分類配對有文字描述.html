<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果構造挑戰賽 - 垂直置中優化版</title>
    <style>
        :root {
            --primary: #22a6b3;
            --accent: #ff9f43;
            --bg: #f5f6fa;
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --text-dark: #2d3436;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            width: 100vw; 
            height: 100vh;
            display: flex; 
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding-top: 2vh;
        }

        /* 標題區：增加下邊距，讓下方的框框整體下移 */
        header { 
            height: 10vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 6vh; /* 這裡從 2vh 改為 6vh，將框框往下推 */
        }
        h1 { font-size: 2.2rem; color: #2c3e50; text-align: center; }
        .score-board { 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: var(--primary);
            background: white;
            padding: 4px 20px;
            border-radius: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: inline-block;
        }

        /* 遊戲主容器：維持原本設定 */
        .game-container {
            display: flex;
            width: 94vw; 
            height: 72vh; /* 微調高度以適應下移空間 */
            gap: 3vw;
            align-items: stretch;
            justify-content: center;
            padding-bottom: 5vh; 
        }

        .left-panel, .right-panel {
            flex: 1;
            height: 100%;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .drop-zone {
            flex-grow: 1;
            border: 6px dashed var(--primary);
            background: white;
            border-radius: 30px;
            padding: 5vh 3vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }
        
        .drop-zone.hover { 
            border-color: var(--accent); 
            background-color: #fffdfa;
            transform: scale(1.01);
        }

        .type-tag {
            background: #ffeaa7;
            color: #d35400;
            font-size: 2.2rem;
            padding: 10px 35px;
            border-radius: 15px;
            font-weight: 900;
            margin-bottom: 3vh;
        }

        .feature-text {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.5;
            color: var(--text-dark);
        }

        .btn-reset {
            height: 60px;
            width: 100%;
            border-radius: 30px;
            border: none;
            background: #2d3436;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn-reset:hover { background: #000; }

        .right-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
        }

        .box {
            background: white;
            border: 2px solid #dcdde1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }

        .drag-item img { max-width: 75%; max-height: 55%; object-fit: contain; }
        .img-label { font-size: 1.3rem; font-weight: 900; margin-top: 5px; }
        .matched-hidden { opacity: 0.1; filter: grayscale(1); pointer-events: none; }

        #overlay-msg {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            padding: 40px 80px; border-radius: 40px; z-index: 999;
            transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none;
        }
        #overlay-msg.show { transform: translate(-50%, -50%) scale(1); }
        .correct { background-color: rgba(46, 204, 113, 0.98); }
        .wrong { background-color: rgba(231, 76, 60, 0.98); }
    </style>
</head>
<body>

    <header>
        <h1>🍎 水果構造挑戰賽</h1>
        <div style="text-align:center; margin-top:5px;">
            <div class="score-board">挑戰進度：<span id="current-idx">1</span> / 12</div>
        </div>
    </header>

    <div id="overlay-msg">
        <span id="overlay-icon" style="font-size: 6rem;"></span>
        <span id="overlay-text" style="font-size: 3rem; font-weight: 900;"></span>
    </div>

    <div class="game-container">
        <div class="left-panel">
            <div id="left-col" class="drop-zone"></div>
            <button class="btn-reset" onclick="initGame()">重新開始挑戰</button>
        </div>
        <div class="right-panel" id="right-col"></div>
    </div>

    <script>
        // 邏輯保持不變...
        const gameData = [
            { id: 1, type: "【核果類】", trait: "肚子裡只有一個硬硬的果核。", img: "芒果.jpg", label: "芒果" },
            { id: 2, type: "【漿果類】", trait: "果肉裡有無數黑色小點點，就像撒了芝麻一樣喔！", img: "火龍果.jpeg", label: "火龍果" },
            { id: 3, type: "【仁果類】", trait: "具有光滑的綠色外皮，中間會留下小小的果核喔。", img: "梨子.jpg", label: "梨子" },
            { id: 4, type: "【核果類】", trait: "細長果柄，內含一顆硬核", img: "櫻桃.jpg", label: "櫻桃" },
            { id: 5, type: "【柑橘類】", trait: "具有黃綠色外皮，果肉酸甜多汁且是一瓣一瓣的喔！", img: "柚子.jpg", label: "文旦" },
            { id: 6, type: "【仁果類】", trait: "土黃色清脆多汁，吃完後中間會留下小小的果核喔。", img: "水梨.jpg", label: "水梨" },
            { id: 7, type: "【瓜果類】", trait: "綠皮條紋，碩大肉質化且富含水分", img: "西瓜.jpg", label: "西瓜" },
            { id: 8, type: "【瓜果類】", trait: "網狀構造，具有特殊網紋與香氣", img: "哈蜜瓜.jpg", label: "哈密瓜" },
            { id: 9, type: "【仁果類】", trait: "紅通通的外皮，把果肉吃完後，中間會留下小果核。", img: "蘋果.jpg", label: "蘋果" },
            { id: 10, type: "【漿果類】", trait: "長條弧形，肚子裡有很多黑點點，果肉厚實柔軟。", img: "香蕉.jpg", label: "香蕉" },
            { id: 11, type: "【漿果類】", trait: "外皮佈滿黃色小點點，那些才是真正的果實喔！", img: "草莓.jpg", label: "草莓" },
            { id: 12, type: "【柑橘類】", trait: "橘色的外皮，剝開是一瓣一瓣的果肉。", img: "橘子.jpg", label: "橘子" }
        ];

        let shuffledQuestions = [];
        let currentQuestionIndex = 0;

        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function showFeedback(isCorrect) {
            const overlay = document.getElementById('overlay-msg');
            overlay.className = 'show ' + (isCorrect ? 'correct' : 'wrong');
            document.getElementById('overlay-icon').innerText = isCorrect ? '✅' : '❌';
            document.getElementById('overlay-text').innerText = isCorrect ? '答對了！' : '再想想！';
            setTimeout(() => { overlay.classList.remove('show'); }, 800);
        }

        function renderNextQuestion() {
            const leftCol = document.getElementById('left-col');
            leftCol.innerHTML = '';
            if (currentQuestionIndex < shuffledQuestions.length) {
                const item = shuffledQuestions[currentQuestionIndex];
                document.getElementById('current-idx').innerText = (currentQuestionIndex + 1);
                leftCol.innerHTML = `
                    <div style="width:100%">
                        <div class="type-tag">${item.type}</div>
                        <div class="feature-text">${item.trait}</div>
                        <p style="color:#95a5a6; margin-top:3vh; font-size:1.4rem;">(將水果拖至此處)</p>
                    </div>
                `;
                leftCol.ondragover = (e) => { e.preventDefault(); leftCol.classList.add('hover'); };
                leftCol.ondragleave = () => leftCol.classList.remove('hover');
                leftCol.ondrop = (e) => {
                    e.preventDefault();
                    leftCol.classList.remove('hover');
                    if (e.dataTransfer.getData('id') == item.id) {
                        const imgSrc = e.dataTransfer.getData('imgSrc');
                        leftCol.innerHTML = `
                            <img src="${imgSrc}" style="height:30vh; max-height:280px; object-fit:contain; margin-bottom:15px;">
                            <h2 style="color:var(--correct); font-size:4rem;">${item.label}！</h2>
                        `;
                        showFeedback(true);
                        document.getElementById(e.dataTransfer.getData('sourceId')).classList.add('matched-hidden');
                        currentQuestionIndex++;
                        setTimeout(renderNextQuestion, 1500);
                    } else { showFeedback(false); }
                };
            } else {
                leftCol.innerHTML = `<h2 style="font-size:3rem; color:var(--primary);">🎊 挑戰完成！</h2>`;
            }
        }

        function initGame() {
            currentQuestionIndex = 0;
            shuffledQuestions = shuffle([...gameData]);
            const fruitPool = shuffle([...gameData]);
            const rightCol = document.getElementById('right-col');
            rightCol.innerHTML = '';
            fruitPool.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'box drag-item';
                div.draggable = true;
                div.id = 'fruit-' + index;
                div.innerHTML = `<img src="${item.img}" onerror="this.src='https://via.placeholder.com/150?text=${item.label}'"><div class="img-label">${item.label}</div>`;
                div.ondragstart = (e) => {
                    e.dataTransfer.setData('id', item.id);
                    e.dataTransfer.setData('sourceId', div.id);
                    e.dataTransfer.setData('imgSrc', item.img);
                };
                rightCol.appendChild(div);
            });
            renderNextQuestion();
        }
        initGame();
    </script>
</body>
</html>
