<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水果分類挑戰 - 提示圖左上版</title>
    <style>
        :root { 
            --sky-top: #4FC3F7; --sky-bottom: #E3F2FD;
            --grass-bg: rgba(124, 179, 66, 0.4); 
            --bamboo-box: rgba(169, 132, 103, 0.3); 
        }
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; background: var(--sky-bottom); overflow: hidden; touch-action: none; }
        
        #header { height: 70px; background: rgba(255,255,255,0.9); display: flex; justify-content: space-around; align-items: center; border-bottom: 4px solid #ddd; z-index: 1000; position: relative; }
        .score-box { font-size: 30px; font-weight: bold; color: #E65100; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 12px; border: none; background: #FF9800; color: white; font-weight: bold; box-shadow: 0 4px #E65100; }

        /* 天氣與環境 */
        .sun { position: absolute; top: 20px; right: 40px; width: 80px; height: 80px; background: radial-gradient(circle, #FFF176 0%, #FBC02D 100%); border-radius: 50%; box-shadow: 0 0 40px #FFEB3B; z-index: 5; }
        .cloud { position: absolute; background: #fff; border-radius: 50px; opacity: 0.8; z-index: 2; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
        .cloud-1 { width: 120px; height: 40px; top: 50px; left: -150px; animation: moveCloud 35s linear infinite; }
        .cloud-1::before { width: 50px; height: 50px; top: -20px; left: 15px; }
        .cloud-1::after { width: 70px; height: 70px; top: -35px; left: 40px; }
        .cloud-2 { width: 100px; height: 30px; top: 120px; left: -120px; animation: moveCloud 25s linear infinite 5s; }
        .cloud-2::before { width: 40px; height: 40px; top: -15px; left: 10px; }
        .cloud-2::after { width: 50px; height: 50px; top: -25px; left: 35px; }
        @keyframes moveCloud { from { transform: translateX(-10vw); } to { transform: translateX(110vw); } }

        #stage { 
            position: relative; width: 100vw; height: calc(100vh - 250px); 
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 75%, #9CCC65 75%); 
            z-index: 10;
        }

        /* 樹木與草地樣式 */
        .trunk { position: absolute; background: #5D4037; border-radius: 5px; }
        .leaf { position: absolute; border-radius: 50%; box-shadow: inset -10px -10px rgba(0,0,0,0.1); }
        .main-tree { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); width: 750px; height: 550px; z-index: 20; pointer-events: none; }
        .main-tree .trunk { left: 345px; bottom: 0; width: 60px; height: 70px; }
        .main-tree .layer-1 { width: 720px; height: 350px; background: #1B5E20; left: 15px; bottom: 50px; }
        .main-tree .layer-2 { width: 580px; height: 300px; background: #2E7D32; left: 85px; bottom: 140px; }
        .main-tree .layer-3 { width: 450px; height: 250px; background: #388E3C; left: 150px; bottom: 240px; }
        .main-tree .layer-4 { width: 300px; height: 200px; background: #4CAF50; left: 225px; bottom: 330px; }

        .cute-flower { position: absolute; width: 22px; height: 22px; z-index: 12; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .flower-core { position: absolute; width: 7px; height: 7px; background: #FFEB3B; border-radius: 50%; z-index: 10; }
        .petal { position: absolute; width: 9px; height: 9px; background: inherit; border-radius: 50%; }
        .p1 { transform: rotate(0deg) translateY(-5px); }
        .p2 { transform: rotate(72deg) translateY(-5px); }
        .p3 { transform: rotate(144deg) translateY(-5px); }
        .p4 { transform: rotate(216deg) translateY(-5px); }
        .p5 { transform: rotate(288deg) translateY(-5px); }

        /* 水果樣式 */
        .fruit { width: 100px; height: 110px; position: absolute; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; z-index: 500; pointer-events: auto; }
        .fruit-icon { font-size: 55px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3)); }
        .orange-css { width: 48px; height: 48px; background: radial-gradient(circle at 30% 30%, #FFEB3B, #F9A825); border-radius: 50%; border: 2px solid #FBC02D; position: relative; }
        .orange-css::before { content: ''; position: absolute; width: 8px; height: 10px; background: #43A047; border-radius: 2px; top: -8px; left: 50%; transform: translateX(-50%); }
        .blueberry-css { width: 30px; height: 30px; background: #311B92; border-radius: 50%; box-shadow: 20px 10px 0 #311B92; position: relative; }
        .blueberry-css::before { content: ''; position: absolute; width: 8px; height: 12px; background: #66BB6A; border-radius: 50% 0 50% 0; top: -12px; left: 14px; transform: rotate(-10deg); border: 1px solid #1B5E20; }
        .longan-css { width: 15px; height: 15px; background: #A98467; border-radius: 50%; box-shadow: -15px 0 0 #8D6E63, 15px 0 0 #BCAAA4, -8px 12px 0 #795548, 8px 12px 0 #8D6E63, 0px 24px 0 #5D4037; position: relative; }
        .longan-css::before { content: ''; position: absolute; width: 3px; height: 15px; background: #5D4037; top: -12px; left: 6px; }
        .fruit-name { background: white; border: 2.5px solid #333; border-radius: 8px; padding: 1px 10px; font-size: 14px; font-weight: bold; margin-top: -5px; z-index: 10; }

        /* 籃子樣式 */
        #baskets { height: 180px; background: var(--grass-bg); display: flex; justify-content: space-evenly; align-items: flex-end; padding-bottom: 15px; z-index: 15; position: relative; }
        .basket { width: 17%; height: 135px; background-color: var(--bamboo-box); border: 3.5px solid #5D4037; border-radius: 8px 8px 35px 35px; display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 10px; }
        .basket-label { background: rgba(255,255,255,0.95); padding: 4px 10px; border-radius: 8px; font-size: 19px; font-weight: bold; border: 2.5px solid #5D4037; margin-top: 10px; }
        
        /* --- 修正：提示圖在籃子內左上方 --- */
        .hint-img { 
            position: absolute; 
            top: 5px; 
            left: 5px; 
            width: 70px; 
            height: 70px; 
            pointer-events: none; 
            z-index: 100; 
            object-fit: contain; 
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));
        }

        .fruit-in-basket { position: absolute; font-size: 32px; opacity: 0.9; }
        #hint { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); z-index: 20000; display: none; }
        .hint-ok { width: 150px; height: 150px; border: 20px solid #F44336; border-radius: 50%; }
        .hint-no { font-size: 200px; color: #212121; font-weight: bold; }
        #win-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 30000; color: #FFD700; }
    </style>
</head>
<body onclick="unlockAudio()">

<div id="header">
    <div class="score-box">得分: <span id="cur-score">0</span> / 150</div>
    <button class="btn" onclick="resetGame()">重新開始</button>
</div>

<div id="stage">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div id="flower-field" style="position: absolute; width:100%; height:100%; pointer-events:none; z-index:11;"></div>
    <div class="main-tree">
        <div class="trunk"></div>
        <div class="leaf layer-1"></div>
        <div class="leaf layer-2"></div>
        <div class="leaf layer-3"></div>
        <div class="leaf layer-4"></div>
        <div id="tree-fruits-container" style="position:absolute; width:100%; height:100%; pointer-events:none;"></div>
    </div>
    <div id="hint"><div id="o-mark" class="hint-ok"></div><div id="x-mark" class="hint-no">✖</div></div>
</div>

<div id="baskets">
    <div class="basket" data-c="berry">
        <img src="漿果.jpg" class="hint-img">
        <div class="basket-label">漿果</div>
    </div>
    <div class="basket" data-c="citrus">
        <img src="柑橘.jpg" class="hint-img">
        <div class="basket-label">柑橘</div>
    </div>
    <div class="basket" data-c="stone">
        <img src="核果.jpg" class="hint-img">
        <div class="basket-label">核果</div>
    </div>
    <div class="basket" data-c="pome">
        <img src="仁果.jpg" class="hint-img">
        <div class="basket-label">仁果</div>
    </div>
    <div class="basket" data-c="melon">
        <img src="瓜果.jpg" class="hint-img">
        <div class="basket-label">瓜果</div>
    </div>
</div>

<div id="win-screen"><h1>🎆 採收完成！ 🎆</h1><button class="btn" onclick="resetGame()">再玩一次</button></div>
<audio id="sound-pop" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
<audio id="sound-error" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" preload="auto"></audio>

<script>
    const allFruits = [
        { n: '蘋果', c: 'pome', i: '🍎' }, { n: '梨子', c: 'pome', i: '🍐' },
        { n: '草莓', c: 'berry', i: '🍓' }, { n: '葡萄', c: 'berry', i: '🍇' }, 
        { n: '香蕉', c: 'berry', i: '🍌' }, { n: '奇異果', c: 'berry', i: '🥝' }, 
        { n: '西瓜', c: 'melon', i: '🍉' }, { n: '哈密瓜', c: 'melon', i: '🍈' },
        { n: '芒果', c: 'stone', i: '🥭' }, { n: '桃子', c: 'stone', i: '🍑' }, 
        { n: '檸檬', c: 'citrus', i: '🍋' }, { n: '橘子', c: 'citrus', i: '🍊' },
        { n: '柳丁', c: 'citrus', css: 'orange-css' }, 
        { n: '龍眼', c: 'stone', css: 'longan-css' }, 
        { n: '藍莓', c: 'berry', css: 'blueberry-css' }
    ];

    let currentScore = 0, correctCount = 0, audioUnlocked = false;

    function createFlowerField() {
        const field = document.getElementById('flower-field');
        field.innerHTML = '';
        const colors = ['#FF4081', '#FF9100', '#E040FB', '#00E676', '#00B0FF', '#FFEB3B'];
        for (let i = 0; i < 40; i++) {
            const f = document.createElement('div');
            f.className = 'cute-flower';
            const color = colors[Math.floor(Math.random() * colors.length)];
            f.style.left = Math.random() * 95 + "%";
            f.style.top = (Math.random() * 15 + 80) + "%";
            for(let j=1; j<=5; j++) {
                const p = document.createElement('div');
                p.className = `petal p${j}`;
                p.style.backgroundColor = color;
                f.appendChild(p);
            }
            const core = document.createElement('div');
            core.className = 'flower-core';
            f.appendChild(core);
            field.appendChild(f);
        }
    }

    function resetGame() {
        currentScore = 0; correctCount = 0;
        document.getElementById('cur-score').innerText = "0";
        document.getElementById('win-screen').style.display = 'none';
        const container = document.getElementById('tree-fruits-container');
        container.innerHTML = '';
        document.querySelectorAll('.basket .fruit-in-basket').forEach(f => f.remove());
        createFlowerField();
        const shuffled = [...allFruits].sort(() => Math.random() - 0.5);
        const rows = [{ count: 2, y: 15, gap: 115 }, { count: 3, y: 110, gap: 135 }, { count: 4, y: 205, gap: 130 }, { count: 6, y: 300, gap: 110 }];
        let k = 0;
        rows.forEach(config => {
            const startX = (750 - (config.count - 1) * config.gap) / 2;
            for (let i = 0; i < config.count; i++) {
                if (k >= shuffled.length) break;
                const data = shuffled[k++];
                const div = document.createElement('div');
                div.className = 'fruit';
                let visual = data.css ? `<div class="${data.css}"></div>` : `<span class="fruit-icon">${data.i}</span>`;
                div.innerHTML = `<div style="height:75px; display:flex; align-items:center; justify-content:center;">${visual}</div><span class="fruit-name">${data.n}</span>`;
                div.dataset.c = data.c;
                if(data.css) div.dataset.isCss = data.css; else div.dataset.emoji = data.i;
                const fx = startX + (i * config.gap) - 50; 
                div.style.left = fx + "px"; div.style.top = config.y + "px";
                div.dataset.ox = fx; div.dataset.oy = config.y;
                bindDragEvent(div);
                container.appendChild(div);
            }
        });
    }

    function bindDragEvent(el) {
        let isMoving = false, startX, startY, origLeft, origTop;
        const onStart = (e) => {
            if (!audioUnlocked) unlockAudio();
            isMoving = true;
            const t = e.touches ? e.touches[0] : e;
            startX = t.clientX; startY = t.clientY;
            origLeft = el.offsetLeft; origTop = el.offsetTop;
            el.style.zIndex = 10000;
        };
        const onMove = (e) => {
            if (!isMoving) return;
            const t = e.touches ? e.touches[0] : e;
            el.style.left = (origLeft + (t.clientX - startX)) + "px";
            el.style.top = (origTop + (t.clientY - startY)) + "px";
        };
        const onEnd = () => { if (isMoving) { isMoving = false; checkLogic(el); } };
        el.addEventListener('mousedown', onStart); el.addEventListener('touchstart', onStart);
        window.addEventListener('mousemove', onMove); window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('mouseup', onEnd); window.addEventListener('touchend', onEnd);
    }

    function checkLogic(el) {
        const baskets = document.querySelectorAll('.basket');
        const fr = el.getBoundingClientRect();
        let hit = false;
        baskets.forEach(b => {
            const br = b.getBoundingClientRect();
            if (!(fr.right < br.left || fr.left > br.right || fr.bottom < br.top || fr.top > br.bottom)) {
                hit = true;
                if (el.dataset.c === b.dataset.c) {
                    showFeedback('o'); document.getElementById('sound-pop').play();
                    const clone = document.createElement('div');
                    clone.className = 'fruit-in-basket';
                    if(el.dataset.isCss) clone.innerHTML = `<div class="${el.dataset.isCss}" style="transform:scale(0.5)"></div>`;
                    else clone.innerText = el.dataset.emoji;
                    clone.style.left = (Math.random()*60+15) + "%"; clone.style.top = (Math.random()*40+40) + "%";
                    b.appendChild(clone); el.remove();
                    correctCount++; currentScore += 10; document.getElementById('cur-score').innerText = currentScore;
                    if (correctCount === 15) document.getElementById('win-screen').style.display = 'flex';
                } else {
                    showFeedback('x'); document.getElementById('sound-error').play();
                    el.style.left = el.dataset.ox + "px"; el.style.top = el.dataset.oy + "px"; el.style.zIndex = 500;
                }
            }
        });
        if (!hit) { el.style.left = el.dataset.ox + "px"; el.style.top = el.dataset.oy + "px"; el.style.zIndex = 500; }
    }

    function showFeedback(type) {
        document.getElementById('o-mark').style.display = type === 'o' ? 'block' : 'none';
        document.getElementById('x-mark').style.display = type === 'x' ? 'block' : 'none';
        document.getElementById('hint').style.display = 'block';
        setTimeout(() => document.getElementById('hint').style.display = 'none', 800);
    }

    function unlockAudio() {
        const p = document.getElementById('sound-pop');
        p.play().then(() => { p.pause(); audioUnlocked = true; }).catch(()=>{});
    }

    resetGame();
</script>
</body>
</html>
